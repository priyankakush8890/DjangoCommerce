<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart Checkout - Pay ₹{{ total_amount }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-lg border-0 p-5 rounded-4">
                    <h2 class="mb-3">Cart Checkout 💳</h2>
                    <p class="text-muted">Total payable amount for your items:</p>
                    <h1 class="text-success mb-4 font-monospace">₹{{ total_amount }}</h1>
                    
                    <div class="d-grid">
                        <button id="rzp-button1" class="btn btn-primary btn-lg shadow-sm">Pay Now</button>
                    </div>
                    
                    <a href="{% url 'cart_view' %}" class="btn btn-link mt-3 text-decoration-none text-muted small">← Back to Cart</a>
                </div>
            </div>
        </div>
    </div>

    <form action="{% url 'payment_success' %}" method="POST" id="razorpay-form">
        {% csrf_token %}
        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    var options = {
        "key": "{{ razorpay_key }}", 
        "amount": "{{ order.amount }}", 
        "currency": "INR",
        "name": "My AI Store",
        "description": "Payment for your Cart",
        "order_id": "{{ order.id }}", 
        "handler": function (response){
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
            document.getElementById('razorpay_signature').value = response.razorpay_signature;
            document.getElementById('razorpay-form').submit();
        },
        "prefill": { "name": "{{ request.user.username }}", "email": "{{ request.user.email }}" },
        "theme": { "color": "#0d6efd" }
    };
    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function(e){ rzp1.open(); e.preventDefault(); }
    </script>
</body>
</html>
