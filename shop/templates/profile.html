{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | SHOP CART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #131921;
            color: white;
            font-family: 'Poppins', sans-serif;
            padding-top: 100px;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="profile-card shadow-lg">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="100" class="mb-3">
                    <h2 class="fw-bold">Welcome, {{ user.username }}!</h2>
                    <p class="text-info">{{ user.email }}</p>
                    <hr class="bg-light">
                    <div class="text-start">
                        <p><strong>Username:</strong> {{ user.username }}</p>
                        <p><strong>Member Since:</strong> {{ user.date_joined|date:"M d, Y" }}</p>
                    </div>
                    <a href="{% url 'index' %}" class="btn btn-danger mt-3 w-100">Back to Shopping</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light mt-2 w-100">Logout</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
