<div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-5">
        <h2 class="text-center mb-4">Order Summary</h2>
        <hr>
        
        <div class="mb-4">
            {% for item in items %}
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h6 class="mb-0"><strong>{{ item.product.name }}</strong></h6>
                    <small class="text-muted">Category: {{ item.product.category }}</small>
                </div>
                <div class="text-end">
                    <span class="text-dark fw-bold">₹{{ item.product.price }}</span>
                    <br>
                    <small class="text-muted">Qty: {{ item.quantity }}</small>
                </div>
            </div>
            {% empty %}
            <p class="text-center text-muted">No items found.</p>
            {% endfor %}
        </div>

        <hr>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 text-secondary">Total Payable:</h4>
            <h2 class="text-success mb-0">₹{{ total_amount }}</h2>
        </div>

        <div class="d-grid">
            <button id="rzp-button1" class="btn btn-primary btn-lg shadow-sm">Pay Now</button>
        </div>
    </div>
</div>
